<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body class="login-page">
    <main class="container">
        <section class="card">
            <h2>تسجيل دخول الإدارة</h2>
            <p id="login-error" class="error-msg"></p>
            <form id="login-form">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required autocomplete="username">
                <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="current-password">
                <button type="submit" id="login-btn" class="btn btn-primary">تسجيل الدخول</button>
            </form>
        </section>
    </main>
    <script type="module" src="login.js"></script>
</body>
</html>
